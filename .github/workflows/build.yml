name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests browser-cookie3
    
    - name: Build executable
      run: |
        pyinstaller --onefile --noconfirm --name horizons-checker-${{ matrix.platform }} main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: horizons-checker-${{ matrix.platform }}
        path: dist/
